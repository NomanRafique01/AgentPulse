<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70" width="100%" height="100%">
  <defs>
    <style>
      .title-agent {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 50px;
        letter-spacing: -0.035em;
        fill: #0f172a;
      }
      .title-pulse {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 50px;
        letter-spacing: -0.025em;
        fill: url(#pulseGradLight);
      }
      @media (prefers-color-scheme: dark) {
        .title-agent {
          fill: #ffffff;
        }
        .title-pulse {
          fill: url(#pulseGradDark);
          filter: drop-shadow(0 0 14px rgba(0, 230, 118, 0.45));
        }
      }
    </style>

    <!-- Dark Mode Pulse Gradient -->
    <linearGradient id="pulseGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="60%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>

    <!-- Light Mode Pulse Gradient -->
    <linearGradient id="pulseGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a846"/>
      <stop offset="100%" stop-color="#008a38"/>
    </linearGradient>
  </defs>

  <!-- Perfectly Centered Proper Name: AgentPulse -->
  <text x="50%" y="53" text-anchor="middle">
    <tspan class="title-agent">Agent</tspan><tspan class="title-pulse">Pulse</tspan>
  </text>
</svg>
